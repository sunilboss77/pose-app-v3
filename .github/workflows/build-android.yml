name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS API base URL. The default https://example.com is for camera-only testing; AI will not work with this placeholder.'
        required: false
        default: 'https://example.com'
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Validate API base URL
        shell: bash
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          node <<'NODE'
          const raw = process.env.API_BASE_URL ?? ''

          if (!raw || raw !== raw.trim()) {
            throw new Error('api_base_url must be a non-empty HTTPS URL without surrounding whitespace.')
          }

          let url
          try {
            url = new URL(raw)
          } catch {
            throw new Error('api_base_url must be a valid HTTPS URL.')
          }

          if (
            url.protocol !== 'https:' ||
            !url.hostname ||
            url.username ||
            url.password ||
            url.search ||
            url.hash ||
            raw.includes('?') ||
            raw.includes('#')
          ) {
            throw new Error('api_base_url must use HTTPS and contain no credentials, query, or fragment.')
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build mobile web assets
        run: pnpm build:mobile

      - name: Sync Capacitor Android project
        run: pnpm cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pose-guide-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
